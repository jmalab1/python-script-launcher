<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Control</title>
<script>
// Stored theme wins; anything else (no choice yet, or 'dark') is dark,
// matching the app default in state.js.
(function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.classList.remove('dark');}else{document.documentElement.classList.add('dark');}})();
</script>
<link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
    font-family: 'Inter';
    src: url('/static/fonts/InterVariable.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
}
</style>
<script src="/static/tailwindcss.js"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Inter', 'system-ui', 'sans-serif'],
            },
        },
    },
}
</script>
<style type="text/tailwindcss">
@layer base {
    body {
        @apply font-sans bg-gray-950 text-gray-200 antialiased;
    }
}
</style>
<style>
.nav-btn {
    color: #6b7280;
    transition: all 150ms ease;
}
.dark .nav-btn { color: #9ca3af; }
.nav-btn:hover { color: #111827; background-color: #f3f4f6; }
.dark .nav-btn:hover { color: #f3f4f6; background-color: rgba(55,65,81,.5); }
.nav-btn.active {
    color: #7c3aed;
    background-color: rgba(124,58,237,.1);
}
.dark .nav-btn.active {
    color: #a78bfa;
    background-color: rgba(124,58,237,.15);
    box-shadow: inset 3px 0 0 #7c3aed;
}
.nav-btn.active:hover {
    background-color: rgba(124,58,237,.15);
}
.dark .nav-btn.active:hover {
    background-color: rgba(124,58,237,.2);
}
.mob-nav { transition: all 150ms ease; }

aside { width: 12rem; }
@media (max-width: 767px) {
    aside { width: min(12rem, 65vw); }
}

/* Tables marked .data-table keep their header visible while scrolling. */
.data-table thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    background-color: #ffffff;
}
.dark .data-table thead th {
    background-color: #1f2937;
}

/* The run output panel slides in from the right when it opens and slides
   back out when it closes. The transforms apply only while the animations
   run, so they never catch fixed-position children (the stop confirm
   modal) once the panel has settled — except during slide-out, where the
   panel is being removed anyway. */
@keyframes run-panel-slide-in {
    from { transform: translateX(100%); }
    to   { transform: translateX(0); }
}
@keyframes run-panel-slide-out {
    from { transform: translateX(0); }
    to   { transform: translateX(100%); }
}
.run-panel-in {
    animation: run-panel-slide-in 180ms ease-out;
}
.run-panel-out {
    animation: run-panel-slide-out 220ms ease-in-out forwards;
}
</style>
</head>
<body class="overflow-hidden">
<div id="app"></div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
