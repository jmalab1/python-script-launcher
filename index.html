<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Web Launcher</title>
<script>
(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.classList.remove('dark');else if(t==='dark')document.documentElement.classList.add('dark');else if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark');else document.documentElement.classList.add('dark');})();
</script>
<link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
    font-family: 'Inter';
    src: url('/static/fonts/InterVariable.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
}
</style>
<script src="/static/tailwindcss.js"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Inter', 'system-ui', 'sans-serif'],
            },
        },
    },
}
</script>
<style type="text/tailwindcss">
@layer base {
    body {
        @apply font-sans bg-gray-950 text-gray-200 antialiased;
    }
}
</style>
</head>
<body class="overflow-hidden">

<div class="flex h-screen">

    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-[220px] bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700/60 shrink-0">
        <div class="flex items-center gap-2.5 px-5 py-4 border-b border-gray-200 dark:border-gray-700/60">
            <svg class="w-7 h-7 text-violet-500 shrink-0" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M31.956 14.8C31.372 6.92 25.08.628 17.2.044V5.76a9.04 9.04 0 0 0 9.04 9.04h5.716ZM14.8 26.24v5.716C6.92 31.372.63 25.08.044 17.2H5.76a9.04 9.04 0 0 1 9.04 9.04Zm11.44-9.04h5.716c-.584 7.88-6.876 14.172-14.756 14.756V26.24a9.04 9.04 0 0 1 9.04-9.04ZM.044 14.8C.63 6.92 6.92.628 14.8.044V5.76a9.04 9.04 0 0 1-9.04 9.04H.044Z" fill="currentColor"/></svg>
            <span class="text-[15px] font-bold text-gray-800 dark:text-gray-100 tracking-tight">Launcher</span>
        </div>
        <nav class="flex-1 px-3 py-3 space-y-0.5">
            <button onclick="showPanel('profiles')" id="nav-profiles" class="nav-btn active w-full text-left flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 0 1-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 0 1 4.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0 1 12 15a9.065 9.065 0 0 0-6.23.693L5 14.5m14.8.8 1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0 1 12 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"/></svg>
                Profiles
            </button>
            <button onclick="showPanel('workflows')" id="nav-workflows" class="nav-btn w-full text-left flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.678 48.678 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3-3 3"/></svg>
                Workflows
            </button>
        </nav>
        <div class="px-3 py-3 border-t border-gray-200 dark:border-gray-700/60">
            <button onclick="toggleTheme()" id="theme-toggle" class="nav-btn w-full text-left flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium">
                <svg id="theme-icon-dark" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
                <svg id="theme-icon-light" class="w-4 h-4 shrink-0 hidden" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
                <span id="theme-label">Light Mode</span>
            </button>
        </div>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 lg:hidden hidden" onclick="toggleSidebar()"></div>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- Top bar (mobile) -->
        <header class="flex items-center gap-3 px-4 py-3 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700/60 lg:hidden shrink-0">
            <button onclick="toggleSidebar()" class="p-1.5 rounded-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
            </button>
            <svg class="w-6 h-6 text-violet-500 shrink-0" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M31.956 14.8C31.372 6.92 25.08.628 17.2.044V5.76a9.04 9.04 0 0 0 9.04 9.04h5.716ZM14.8 26.24v5.716C6.92 31.372.63 25.08.044 17.2H5.76a9.04 9.04 0 0 1 9.04 9.04Zm11.44-9.04h5.716c-.584 7.88-6.876 14.172-14.756 14.756V26.24a9.04 9.04 0 0 1 9.04-9.04ZM.044 14.8C.63 6.92 6.92.628 14.8.044V5.76a9.04 9.04 0 0 1-9.04 9.04H.044Z" fill="currentColor"/></svg>
            <span class="text-sm font-bold text-gray-800 dark:text-gray-100">Launcher</span>
            <div class="flex-1"></div>
            <button onclick="toggleTheme()" class="p-1.5 rounded-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/50">
                <svg id="mob-theme-icon-dark" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
                <svg id="mob-theme-icon-light" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
            </button>
            <div class="flex gap-1">
                <button onclick="showPanel('profiles')" class="mob-nav px-2.5 py-1 rounded-md text-xs font-medium text-violet-500 bg-violet-500/10">Profiles</button>
                <button onclick="showPanel('workflows')" class="mob-nav px-2.5 py-1 rounded-md text-xs font-medium text-gray-500 dark:text-gray-400">Workflows</button>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900">
            <div class="flex flex-col px-4 sm:px-6 lg:px-8 py-6 w-full min-h-full">

                <!-- PROFILES -->
                <div id="panel-profiles" class="panel">
                    <div class="flex items-center justify-between mb-6">
                        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Profiles</h1>
                        <button onclick="openProfileModal()" class="bg-gray-900 text-gray-100 hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-800 dark:hover:bg-white text-sm font-medium px-3 py-2 rounded-lg inline-flex items-center gap-1.5 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                            New Profile
                        </button>
                    </div>
                    <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">
                        <div class="xl:col-span-2">
                            <div id="profiles-list" class="space-y-3"></div>
                        </div>
                        <div class="xl:col-span-3">
                            <div class="bg-white dark:bg-gray-800 shadow-xs rounded-xl border border-gray-200 dark:border-gray-700/60">
                                <header class="px-5 py-4 border-b border-gray-100 dark:border-gray-700/60">
                                    <h2 class="font-semibold text-gray-800 dark:text-gray-100">Profile Run History</h2>
                                </header>
                                <div class="p-3">
                                    <div id="profile-history-table-wrap"></div>
                                    <div id="profile-history-pagination" class="mt-3 flex items-center justify-center gap-1"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- WORKFLOWS -->
                <div id="panel-workflows" class="panel hidden">
                    <div class="flex items-center justify-between mb-6">
                        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Workflows</h1>
                        <button onclick="openWorkflowModal()" class="bg-gray-900 text-gray-100 hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-800 dark:hover:bg-white text-sm font-medium px-3 py-2 rounded-lg inline-flex items-center gap-1.5 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                            New Workflow
                        </button>
                    </div>
                    <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">
                        <div class="xl:col-span-2">
                            <div id="workflows-list" class="space-y-3"></div>
                        </div>
                        <div class="xl:col-span-3">
                            <div class="bg-white dark:bg-gray-800 shadow-xs rounded-xl border border-gray-200 dark:border-gray-700/60">
                                <header class="px-5 py-4 border-b border-gray-100 dark:border-gray-700/60">
                                    <h2 class="font-semibold text-gray-800 dark:text-gray-100">Run History</h2>
                                </header>
                                <div class="p-3">
                                    <div id="history-table-wrap"></div>
                                    <div id="history-pagination" class="mt-3 flex items-center justify-center gap-1"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- PROFILE MODAL -->
<div id="profile-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal('profile-modal')"></div>
    <div class="relative flex items-center justify-center min-h-full p-4">
        <div class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] overflow-y-auto border border-gray-200 dark:border-gray-700/60">
            <div class="sticky top-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700/60 px-6 py-4 rounded-t-2xl z-10">
                <div class="flex items-center justify-between">
                    <h2 id="profile-modal-title" class="text-lg font-semibold text-gray-800 dark:text-gray-100">New Profile</h2>
                    <button onclick="closeModal('profile-modal')" class="p-1 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="px-6 py-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Profile Name</label>
                    <input type="text" id="profile-name" placeholder="e.g. Data Pipeline" class="w-full bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded-lg px-3 py-2 text-sm text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Script Path</label>
                    <div class="flex gap-2">
                        <input type="text" id="profile-script-path" placeholder="No file selected" readonly class="flex-1 bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded-lg px-3 py-2 text-sm text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 cursor-default">
                        <button onclick="openNativeFileDialog()" class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 text-sm font-medium px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700/60 transition whitespace-nowrap">Browse</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Arguments <span class="text-gray-400 font-normal">(one per line)</span></label>
                    <textarea id="profile-args" rows="3" placeholder="--input data.csv&#10;--verbose" class="w-full bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded-lg px-3 py-2 text-sm text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 font-mono focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition resize-y"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Custom Argument Fields</label>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Define named fields that appear as editable inputs on the profile card.</p>
                    <div id="custom-args-list" class="space-y-2"></div>
                    <button onclick="addCustomArgDef()" class="mt-2 text-xs text-violet-500 hover:text-violet-600 font-medium">+ Add Argument Field</button>
                </div>
            </div>
            <div class="sticky bottom-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700/60 px-6 py-4 rounded-b-2xl flex justify-end gap-2">
                <button onclick="closeModal('profile-modal')" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50 rounded-lg transition">Cancel</button>
                <button onclick="saveProfile()" class="bg-gray-900 text-gray-100 hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-800 dark:hover:bg-white text-sm font-medium px-4 py-2 rounded-lg transition">Save Profile</button>
            </div>
        </div>
    </div>
</div>

<!-- WORKFLOW MODAL -->
<div id="workflow-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal('workflow-modal')"></div>
    <div class="relative flex items-center justify-center min-h-full p-4">
        <div class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] overflow-y-auto border border-gray-200 dark:border-gray-700/60">
            <div class="sticky top-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700/60 px-6 py-4 rounded-t-2xl z-10">
                <div class="flex items-center justify-between">
                    <h2 id="workflow-modal-title" class="text-lg font-semibold text-gray-800 dark:text-gray-100">New Workflow</h2>
                    <button onclick="closeModal('workflow-modal')" class="p-1 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="px-6 py-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Workflow Name</label>
                    <input type="text" id="workflow-name" placeholder="e.g. ETL Pipeline" class="w-full bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded-lg px-3 py-2 text-sm text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Add Step</label>
                    <div class="flex gap-2">
                        <select id="workflow-step-profile" class="flex-1 bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded-lg px-3 py-2 text-sm text-gray-800 dark:text-gray-100 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition"></select>
                        <select id="workflow-step-mode" class="bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded-lg px-3 py-2 text-sm text-gray-800 dark:text-gray-100 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">
                            <option value="sequential">Sequential</option>
                            <option value="parallel">Parallel</option>
                        </select>
                        <button onclick="addWorkflowStep()" class="bg-gray-900 text-gray-100 hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-800 dark:hover:bg-white text-sm font-medium px-3 py-2 rounded-lg transition">Add</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Steps</label>
                    <div id="workflow-steps" class="space-y-2"></div>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="workflow-continue-on-error" class="w-4 h-4 rounded border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900/30 text-violet-500 focus:ring-violet-500/50 focus:ring-offset-0">
                    <label for="workflow-continue-on-error" class="text-sm text-gray-700 dark:text-gray-300">Continue on error</label>
                </div>
            </div>
            <div class="sticky bottom-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700/60 px-6 py-4 rounded-b-2xl flex justify-end gap-2">
                <button onclick="closeModal('workflow-modal')" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50 rounded-lg transition">Cancel</button>
                <button onclick="saveWorkflow()" class="bg-gray-900 text-gray-100 hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-800 dark:hover:bg-white text-sm font-medium px-4 py-2 rounded-lg transition">Save Workflow</button>
            </div>
        </div>
    </div>
</div>

<!-- RUN MODAL -->
<div id="run-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal('run-modal')"></div>
    <div class="relative flex items-center justify-center min-h-full p-4">
        <div class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-5xl max-h-[85vh] flex flex-col border border-gray-200 dark:border-gray-700/60">
            <div class="shrink-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700/60 px-6 py-4 rounded-t-2xl">
                <div class="flex items-center justify-between">
                    <h2 id="run-modal-title" class="text-lg font-semibold text-gray-800 dark:text-gray-100">Run Output</h2>
                    <button onclick="closeModal('run-modal')" class="p-1 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="mt-3 flex items-center gap-3">
                    <span id="run-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-400">
                        <span id="run-status-dot" class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-pulse"></span>
                        <span id="run-status-text">Starting...</span>
                    </span>
                    <span id="run-current-step" class="text-xs text-gray-500 dark:text-gray-400 hidden"></span>
                </div>
            </div>
            <div id="run-tabs" class="shrink-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700/60 px-6 hidden">
                <div class="flex gap-1 -mb-px overflow-x-auto" id="run-tab-list"></div>
            </div>
            <div class="flex-1 overflow-hidden p-4">
                <div id="run-output" class="h-full bg-gray-950 rounded-xl p-4 font-mono text-xs leading-relaxed overflow-y-auto text-gray-300 whitespace-pre-wrap break-all"></div>
            </div>
            <div class="shrink-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700/60 px-6 py-3 rounded-b-2xl flex justify-end">
                <button onclick="closeModal('run-modal')" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50 rounded-lg transition">Close</button>
            </div>
        </div>
    </div>
</div>

<style>
.nav-btn {
    color: #6b7280;
    transition: all 150ms ease;
}
.dark .nav-btn { color: #9ca3af; }
.nav-btn:hover { color: #111827; background-color: #f3f4f6; }
.dark .nav-btn:hover { color: #f3f4f6; background-color: rgba(55,65,81,.5); }
.nav-btn.active {
    color: #7c3aed;
    background-color: rgba(124,58,237,.1);
}
.dark .nav-btn.active {
    color: #a78bfa;
    background-color: rgba(124,58,237,.15);
    box-shadow: inset 3px 0 0 #7c3aed;
}
.nav-btn.active:hover {
    background-color: rgba(124,58,237,.15);
}
.dark .nav-btn.active:hover {
    background-color: rgba(124,58,237,.2);
}
.mob-nav { transition: all 150ms ease; }
</style>

<script>
let profiles = [];
let workflows = [];
let editingProfileId = null;
let editingWorkflowId = null;
let workflowSteps = [];
let currentRunId = null;
let runPollTimer = null;
let customArgDefs = [];
let scriptStatusCache = {};

async function checkScriptExists(path) {
    if (scriptStatusCache[path] !== undefined) return scriptStatusCache[path];
    const res = await api('GET', '/api/script_exists?path=' + encodeURIComponent(path));
    scriptStatusCache[path] = res.exists;
    return res.exists;
}

async function checkAllScripts() {
    for (const p of profiles) {
        if (p.script_path) {
            scriptStatusCache[p.script_path] = await api('GET', '/api/script_exists?path=' + encodeURIComponent(p.script_path)).then(r => r.exists);
        }
    }
}

async function init() {
    await loadProfiles();
    await loadWorkflows();
    await checkAllScripts();
    renderProfiles();
    renderWorkflows();
    loadProfileHistory();
    profileHistoryTimer = setInterval(loadProfileHistory, 3000);
    updateThemeUI();
}

async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    return res.json();
}

async function loadProfiles() { profiles = await api('GET', '/api/profiles'); }
async function loadWorkflows() { workflows = await api('GET', '/api/workflows'); }

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('hidden');
    document.getElementById('sidebar').classList.toggle('flex');
    document.getElementById('sidebar-overlay').classList.toggle('hidden');
}

function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.classList.contains('dark');
    if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
    } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
    }
    updateThemeUI();
}

function updateThemeUI() {
    const isDark = document.documentElement.classList.contains('dark');
    document.getElementById('theme-icon-dark').classList.toggle('hidden', !isDark);
    document.getElementById('theme-icon-light').classList.toggle('hidden', isDark);
    document.getElementById('theme-label').textContent = isDark ? 'Light Mode' : 'Dark Mode';
    document.getElementById('mob-theme-icon-dark').classList.toggle('hidden', !isDark);
    document.getElementById('mob-theme-icon-light').classList.toggle('hidden', isDark);
}

function showPanel(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('panel-' + name).classList.remove('hidden');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    const navBtn = document.getElementById('nav-' + name);
    if (navBtn) navBtn.classList.add('active');
    document.querySelectorAll('.mob-nav').forEach(b => {
        b.className = 'mob-nav px-2.5 py-1 rounded-md text-xs font-medium text-gray-500 dark:text-gray-400 transition';
    });
    // Stop all refresh timers
    if (profileHistoryTimer) { clearInterval(profileHistoryTimer); profileHistoryTimer = null; }
    if (workflowHistoryTimer) { clearInterval(workflowHistoryTimer); workflowHistoryTimer = null; }
    if (name === 'profiles') {
        loadProfileHistory();
        profileHistoryTimer = setInterval(loadProfileHistory, 3000);
    }
    if (name === 'workflows') {
        loadHistory();
        workflowHistoryTimer = setInterval(loadHistory, 3000);
    }
}

function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

function renderProfiles() {
    const el = document.getElementById('profiles-list');
    if (!profiles.length) {
        el.innerHTML = '<div class="text-center py-16 text-gray-500 dark:text-gray-400"><div class="text-4xl mb-3">&#128196;</div><p>No profiles yet. Create one to get started.</p></div>';
        return;
    }
    el.innerHTML = profiles.map(p => {
        const ca = p.custom_args || [];
        const sa = p.args || [];
        const scriptMissing = scriptStatusCache[p.script_path] === false;
        const scriptBadge = scriptMissing
            ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-500/20" title="Script not found"><svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>${esc(p.script_path)}</span>`
            : `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-400">${esc(p.script_path)}</span>`;
        return `
        <div class="bg-white dark:bg-gray-800 shadow-xs rounded-xl p-4 border ${scriptMissing ? 'border-red-200 dark:border-red-500/30' : 'border-gray-200 dark:border-gray-700/60'} hover:border-gray-300 dark:hover:border-gray-600 transition group">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0 flex-1">
                    <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-100">${esc(p.name)}</h3>
                    <div class="flex flex-wrap items-center gap-1.5 mt-2">
                        ${scriptBadge}
                        ${sa.map(a => `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-violet-500/10 text-violet-600 dark:text-violet-400">${esc(a)}</span>`).join('')}
                    </div>
                    ${ca.length ? `<div class="flex flex-wrap items-center gap-3 mt-3">${ca.map((c, i) => {
                        if (c.type === 'checkbox') return `<label class="inline-flex items-center gap-1.5 text-xs text-gray-600 dark:text-gray-300 cursor-pointer"><input type="checkbox" id="arg-${p.id}-${i}" data-profile="${p.id}" data-idx="${i}" onchange="updateProfileArg(this)" class="w-3.5 h-3.5 rounded border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900/30 text-violet-500 focus:ring-violet-500/50 focus:ring-offset-0">${esc(c.label || c.name)}</label>`;
                        return `<div class="flex items-center gap-1.5"><label class="text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap">${esc(c.label || c.name)}</label><input type="text" id="arg-${p.id}-${i}" data-profile="${p.id}" data-idx="${i}" value="${esc(c.value || c.default || '')}" onchange="updateProfileArg(this)" placeholder="${esc(c.name)}" class="w-32 bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded px-2 py-1 text-xs text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition"></div>`;
                    }).join('')}</div>` : ''}
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <button onclick="runProfile('${p.id}')" ${scriptMissing ? 'disabled title="Script not found"' : ''} class="inline-flex items-center gap-1 px-2.5 py-1.5 ${scriptMissing ? 'bg-gray-100 dark:bg-gray-700/50 text-gray-400 dark:text-gray-500 border border-gray-200 dark:border-gray-700/60 cursor-not-allowed' : 'bg-green-50 dark:bg-green-500/10 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-500/20 hover:bg-green-100 dark:hover:bg-green-500/20'} text-xs font-medium rounded-lg transition">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Run
                    </button>
                    <button onclick="editProfile('${p.id}')" class="px-2.5 py-1.5 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 text-xs font-medium rounded-lg border border-gray-200 dark:border-gray-700/60 hover:bg-gray-50 dark:hover:bg-gray-700 transition">Edit</button>
                    <button onclick="deleteProfile('${p.id}')" class="px-2.5 py-1.5 bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-400 text-xs font-medium rounded-lg border border-red-200 dark:border-red-500/20 hover:bg-red-100 dark:hover:bg-red-500/20 transition">Del</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function openProfileModal(profile) {
    editingProfileId = profile ? profile.id : null;
    document.getElementById('profile-modal-title').textContent = profile ? 'Edit Profile' : 'New Profile';
    document.getElementById('profile-name').value = profile ? profile.name : '';
    document.getElementById('profile-args').value = profile ? (profile.args || []).join('\n') : '';
    document.getElementById('profile-script-path').value = profile ? profile.script_path : '';
    customArgDefs = profile ? JSON.parse(JSON.stringify(profile.custom_args || [])) : [];
    renderCustomArgDefs();
    openModal('profile-modal');
}

function renderCustomArgDefs() {
    const el = document.getElementById('custom-args-list');
    if (!customArgDefs.length) {
        el.innerHTML = '<div class="text-xs text-gray-400 py-2">No custom fields defined.</div>';
        return;
    }
    el.innerHTML = customArgDefs.map((ca, i) => `
        <div class="flex items-center gap-2 p-2 bg-gray-50 dark:bg-gray-900/30 border border-gray-200 dark:border-gray-700/60 rounded-lg">
            <input type="text" value="${esc(ca.name)}" placeholder="Flag (--name)" onchange="customArgDefs[${i}].name=this.value" class="flex-1 bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded px-2 py-1 text-xs text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">
            <input type="text" value="${esc(ca.label || '')}" placeholder="Label" onchange="customArgDefs[${i}].label=this.value" class="flex-1 bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded px-2 py-1 text-xs text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">
            <select onchange="customArgDefs[${i}].type=this.value;renderCustomArgDefs()" class="bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded px-2 py-1 text-xs text-gray-800 dark:text-gray-100 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">
                <option value="text" ${ca.type==='text'?'selected':''}>Text</option>
                <option value="checkbox" ${ca.type==='checkbox'?'selected':''}>Checkbox</option>
            </select>
            ${ca.type !== 'checkbox' ? `<input type="text" value="${esc(ca.default || '')}" placeholder="Default" onchange="customArgDefs[${i}].default=this.value" class="flex-1 bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded px-2 py-1 text-xs text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">` : ''}
            <button onclick="customArgDefs.splice(${i},1);renderCustomArgDefs()" class="p-1 text-gray-400 hover:text-red-500 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg></button>
        </div>
    `).join('');
}

function addCustomArgDef() {
    customArgDefs.push({ name: '', label: '', type: 'text', default: '', value: '' });
    renderCustomArgDefs();
    const inputs = document.querySelectorAll('#custom-args-list input[type="text"]');
    if (inputs.length) inputs[inputs.length - 3].focus();
}

async function updateProfileArg(el) {
    const profileId = el.dataset.profile;
    const idx = parseInt(el.dataset.idx);
    const profile = profiles.find(p => p.id === profileId);
    if (!profile) return;
    const ca = profile.custom_args[idx];
    if (!ca) return;
    ca.value = ca.type === 'checkbox' ? (el.checked ? 'true' : 'false') : el.value;
    await api('POST', '/api/profiles', profile);
    await loadProfiles();
}

function editProfile(id) { const p = profiles.find(x => x.id === id); if (p) openProfileModal(p); }

async function deleteProfile(id) {
    if (!confirm('Delete this profile?')) return;
    await api('DELETE', '/api/profiles/' + id);
    await loadProfiles();
    renderProfiles();
}

async function saveProfile() {
    const name = document.getElementById('profile-name').value.trim();
    const scriptPath = document.getElementById('profile-script-path').value.trim();
    const argsText = document.getElementById('profile-args').value.trim();
    if (!name || !scriptPath) { alert('Name and script path are required.'); return; }
    const args = argsText ? argsText.split('\n').map(s => s.trim()).filter(Boolean) : [];
    const customArgs = customArgDefs.map(ca => ({
        name: ca.name.trim(), label: (ca.label || ca.name).trim(),
        type: ca.type || 'text', default: ca.default || '', value: ca.value || ca.default || '',
    })).filter(ca => ca.name);
    await api('POST', '/api/profiles', { id: editingProfileId, name, script_path: scriptPath, args, custom_args: customArgs });
    delete scriptStatusCache[scriptPath];
    await loadProfiles(); await checkAllScripts(); renderProfiles(); closeModal('profile-modal');
}

async function runProfile(id) {
    const profile = profiles.find(p => p.id === id);
    if (!profile) return;
    if (scriptStatusCache[profile.script_path] === false) {
        alert(`Script not found: ${profile.script_path}`);
        return;
    }
    const argValues = {};
    if (profile?.custom_args) profile.custom_args.forEach((ca, i) => {
        const el = document.getElementById(`arg-${id}-${i}`);
        if (el) argValues[ca.name] = ca.type === 'checkbox' ? (el.checked ? 'true' : 'false') : el.value;
    });
    const res = await api('POST', '/api/run/profile', { profile_id: id, arg_values: argValues });
    if (res.run_id) openRunModal(res.run_id, 'Profile Run');
}

async function openNativeFileDialog() {
    const data = await api('GET', '/api/filedialog');
    if (data.error) { alert(data.error); return; }
    if (data.path) { document.getElementById('profile-script-path').value = data.path; }
}

function renderWorkflows() {
    const el = document.getElementById('workflows-list');
    if (!workflows.length) {
        el.innerHTML = '<div class="text-center py-16 text-gray-500 dark:text-gray-400"><div class="text-4xl mb-3">&#128268;</div><p>No workflows yet. Create one to chain profiles.</p></div>';
        return;
    }
    el.innerHTML = workflows.map(w => {
        const steps = w.steps || [];
        const profileMap = Object.fromEntries(profiles.map(p => [p.id, p]));
        const hasMissingScripts = steps.some(s => {
            const prof = profileMap[s.profile_id] || {};
            return scriptStatusCache[prof.script_path] === false;
        });
        return `
        <div class="bg-white dark:bg-gray-800 shadow-xs rounded-xl border ${hasMissingScripts ? 'border-amber-200 dark:border-amber-500/30' : 'border-gray-200 dark:border-gray-700/60'} hover:border-gray-300 dark:hover:border-gray-600 transition group">
            <div class="p-4">
                <div class="flex items-start justify-between gap-3 mb-3">
                    <div class="min-w-0 flex-1">
                        <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-100">${esc(w.name)}</h3>
                        <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-400">${steps.length} step${steps.length !== 1 ? 's' : ''}</span>
                            ${hasMissingScripts ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-400"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>Missing script</span>' : ''}
                            ${w.continue_on_error ? '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-400">continues on error</span>' : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="runWorkflow('${w.id}')" class="inline-flex items-center gap-1 px-2.5 py-1.5 bg-green-50 dark:bg-green-500/10 text-green-700 dark:text-green-400 text-xs font-medium rounded-lg border border-green-200 dark:border-green-500/20 hover:bg-green-100 dark:hover:bg-green-500/20 transition">
                            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Run
                        </button>
                        <button onclick="editWorkflow('${w.id}')" class="px-2.5 py-1.5 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 text-xs font-medium rounded-lg border border-gray-200 dark:border-gray-700/60 hover:bg-gray-50 dark:hover:bg-gray-700 transition">Edit</button>
                        <button onclick="deleteWorkflow('${w.id}')" class="px-2.5 py-1.5 bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-400 text-xs font-medium rounded-lg border border-red-200 dark:border-red-500/20 hover:bg-red-100 dark:hover:bg-red-500/20 transition">Del</button>
                    </div>
                </div>
                ${steps.length ? `
                <div class="border-t border-gray-100 dark:border-gray-700/60 pt-3">
                    <div class="space-y-0">
                        ${steps.map((s, i) => {
                            const prof = profileMap[s.profile_id] || {};
                            const mode = s.execution_mode || 'sequential';
                            const modeColor = mode === 'parallel' ? 'bg-green-50 dark:bg-green-500/10 text-green-700 dark:text-green-400 border-green-200 dark:border-green-500/20' : 'bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-400 border-gray-200 dark:border-gray-700/60';
                            const isLast = i === steps.length - 1;
                            const stepMissing = scriptStatusCache[prof.script_path] === false;
                            return `
                            <div class="flex items-start gap-3 ${!isLast ? 'pb-3' : ''}">
                                <div class="flex flex-col items-center shrink-0 pt-0.5">
                                    <span class="flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-bold ${stepMissing ? 'bg-red-100 dark:bg-red-500/20 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-500/30' : 'bg-violet-100 dark:bg-violet-500/20 text-violet-700 dark:text-violet-300 border border-violet-200 dark:border-violet-500/30'}">${i + 1}</span>
                                    ${!isLast ? '<div class="w-px h-full min-h-[8px] bg-gray-200 dark:bg-gray-700 mt-1"></div>' : ''}
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="text-xs font-medium ${stepMissing ? 'text-red-700 dark:text-red-400' : 'text-gray-800 dark:text-gray-200'}">${esc(prof.name || 'Unknown Profile')}</span>
                                        <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium border ${modeColor}">${mode}</span>
                                        ${stepMissing ? '<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-[10px] font-medium bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-500/20"><svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>missing</span>' : ''}
                                    </div>
                                    <div class="text-[11px] ${stepMissing ? 'text-red-500 dark:text-red-400' : 'text-gray-500 dark:text-gray-400'} mt-0.5 truncate font-mono">${esc(prof.script_path || '—')}</div>
                                    ${prof.args && prof.args.length ? `<div class="flex flex-wrap gap-1 mt-1">${prof.args.map(a => `<span class="text-[10px] px-1.5 py-0.5 rounded bg-violet-50 dark:bg-violet-500/10 text-violet-600 dark:text-violet-400">${esc(a)}</span>`).join('')}</div>` : ''}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>` : ''}
            </div>
        </div>`;
    }).join('');
}

function openWorkflowModal(workflow) {
    editingWorkflowId = workflow ? workflow.id : null;
    document.getElementById('workflow-modal-title').textContent = workflow ? 'Edit Workflow' : 'New Workflow';
    document.getElementById('workflow-name').value = workflow ? workflow.name : '';
    document.getElementById('workflow-continue-on-error').checked = workflow ? !!workflow.continue_on_error : false;
    document.getElementById('workflow-step-profile').innerHTML = profiles.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    workflowSteps = workflow ? JSON.parse(JSON.stringify(workflow.steps || [])) : [];
    renderWorkflowSteps();
    openModal('workflow-modal');
}

function editWorkflow(id) { const w = workflows.find(x => x.id === id); if (w) openWorkflowModal(w); }

async function deleteWorkflow(id) {
    if (!confirm('Delete this workflow?')) return;
    await api('DELETE', '/api/workflows/' + id);
    await loadWorkflows(); renderWorkflows();
}

function addWorkflowStep() {
    const pid = document.getElementById('workflow-step-profile').value;
    if (!pid) return;
    workflowSteps.push({ profile_id: pid, execution_mode: document.getElementById('workflow-step-mode').value, args: [] });
    renderWorkflowSteps();
}

function renderWorkflowSteps() {
    const el = document.getElementById('workflow-steps');
    if (!workflowSteps.length) { el.innerHTML = '<div class="text-xs text-gray-400 py-2">No steps added yet.</div>'; return; }
    el.innerHTML = workflowSteps.map((s, i) => `
        <div class="flex items-center gap-2 p-2 bg-gray-50 dark:bg-gray-900/30 border border-gray-200 dark:border-gray-700/60 rounded-lg">
            <div class="w-6 h-6 rounded-full bg-violet-500/10 text-violet-600 dark:text-violet-400 flex items-center justify-center text-xs font-bold shrink-0">${i + 1}</div>
            <select onchange="updateStepProfile(${i}, this.value)" class="flex-1 bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded px-2 py-1 text-xs text-gray-800 dark:text-gray-100 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">
                ${profiles.map(p => `<option value="${p.id}" ${s.profile_id === p.id ? 'selected' : ''}>${esc(p.name)} &mdash; ${esc(p.script_path)}</option>`).join('')}
            </select>
            <select onchange="updateStepMode(${i}, this.value)" class="bg-white dark:bg-gray-900/30 border border-gray-300 dark:border-gray-700/60 rounded px-2 py-1 text-xs text-gray-800 dark:text-gray-100 focus:border-violet-500 focus:ring-0 focus:ring-offset-0 transition">
                <option value="sequential" ${s.execution_mode === 'sequential' ? 'selected' : ''}>Sequential</option>
                <option value="parallel" ${s.execution_mode === 'parallel' ? 'selected' : ''}>Parallel</option>
            </select>
            <div class="flex items-center gap-0.5 shrink-0">
                ${i > 0 ? `<button onclick="moveStep(${i},-1)" class="p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/></svg></button>` : ''}
                ${i < workflowSteps.length - 1 ? `<button onclick="moveStep(${i},1)" class="p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></button>` : ''}
                <button onclick="removeStep(${i})" class="p-1 text-gray-400 hover:text-red-500 transition"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg></button>
            </div>
        </div>
    `).join('');
}

function updateStepProfile(i, pid) { workflowSteps[i].profile_id = pid; }
function updateStepMode(i, m) { workflowSteps[i].execution_mode = m; }
function moveStep(i, d) { const j = i + d; [workflowSteps[i], workflowSteps[j]] = [workflowSteps[j], workflowSteps[i]]; renderWorkflowSteps(); }
function removeStep(i) { workflowSteps.splice(i, 1); renderWorkflowSteps(); }

async function saveWorkflow() {
    const name = document.getElementById('workflow-name').value.trim();
    const coe = document.getElementById('workflow-continue-on-error').checked;
    if (!name) { alert('Name is required.'); return; }
    if (!workflowSteps.length) { alert('Add at least one step.'); return; }
    await api('POST', '/api/workflows', {
        id: editingWorkflowId, name, steps: workflowSteps,
        extra_args: [],
        continue_on_error: coe,
    });
    await loadWorkflows(); renderWorkflows(); closeModal('workflow-modal');
}

async function runWorkflow(id) {
    const wf = workflows.find(w => w.id === id);
    if (wf) {
        const profileMap = Object.fromEntries(profiles.map(p => [p.id, p]));
        const missingSteps = (wf.steps || []).filter(s => {
            const prof = profileMap[s.profile_id] || {};
            return scriptStatusCache[prof.script_path] === false;
        });
        if (missingSteps.length) {
            const names = missingSteps.map(s => (profileMap[s.profile_id] || {}).name || s.profile_id).join(', ');
            if (!confirm(`These profiles have missing scripts: ${names}\n\nRun anyway?`)) return;
        }
    }
    const res = await api('POST', '/api/run/workflow', { workflow_id: id });
    if (res.run_id) openRunModal(res.run_id, 'Workflow Run');
}

        const t = e.started_at ? new Date(e.started_at * 1000).toLocaleTimeString() : '-';

    }).join('')}</tbody></table>`;
    renderPag(pag, data, 'profileHistoryPage', 'loadProfileHistory');
}

function renderPag(pag, data, pageVar, loadFn) {
    if (data.pages <= 1) { pag.innerHTML = ''; return; }
    let b = '';
    b += `<button onclick="${pageVar}=1;${loadFn}()" ${data.page===1?'disabled':''} class="px-2 py-1 rounded text-xs bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700/60 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-30 transition">&laquo;</button>`;
    b += `<button onclick="${pageVar}=Math.max(1,${pageVar}-1);${loadFn}()" ${data.page===1?'disabled':''} class="px-2 py-1 rounded text-xs bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700/60 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-30 transition">&lsaquo;</button>`;
    for (let i = Math.max(1, data.page - 2); i <= Math.min(data.pages, data.page + 2); i++)
        b += `<button onclick="${pageVar}=${i};${loadFn}()" class="px-2 py-1 rounded text-xs ${i===data.page ? 'bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700/60 hover:bg-gray-50 dark:hover:bg-gray-700'} transition">${i}</button>`;
    b += `<button onclick="${pageVar}=Math.min(${data.pages},${pageVar}+1);${loadFn}()" ${data.page===data.pages?'disabled':''} class="px-2 py-1 rounded text-xs bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700/60 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-30 transition">&rsaquo;</button>`;
    b += `<button onclick="${pageVar}=${data.pages};${loadFn}()" ${data.page===data.pages?'disabled':''} class="px-2 py-1 rounded text-xs bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700/60 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-30 transition">&raquo;</button>`;
    b += `<span class="text-xs text-gray-400 ml-2">${data.total} total</span>`;
    pag.innerHTML = b;
}

        const t = e.started_at ? new Date(e.started_at * 1000).toLocaleTimeString() : '-';
        const preview = (e.output_preview || '').replace(/\n/g, ' ').substring(0, 60);

        return `<tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition" title="${esc(e.output_preview || '')}"><td class="py-2 px-3 text-gray-400">${data.total - (data.page - 1) * data.per_page - idx}</td><td class="py-2 px-3 font-medium text-gray-800 dark:text-gray-200 cursor-pointer" onclick="openRunModal('${esc(e.run_id)}', '${esc(e.name)}', 'workflow')">${esc(e.name)}</td><td class="py-2 px-3 cursor-pointer" onclick="openRunModal('${esc(e.run_id)}', '${esc(e.name)}', 'workflow')"><span class="${sc}">${e.status}</span></td><td class="py-2 px-3 text-gray-500 dark:text-gray-400 font-mono truncate max-w-[200px] cursor-pointer" onclick="openRunModal('${esc(e.run_id)}', '${esc(e.name)}', 'workflow')">${esc(preview)}</td><td class="py-2 px-3 text-right text-gray-500 dark:text-gray-400 whitespace-nowrap cursor-pointer" onclick="openRunModal('${esc(e.run_id)}', '${esc(e.name)}', 'workflow')">${t}</td><td class="py-2 px-1"><button onclick="event.stopPropagation();deleteHistoryEntry('${esc(e.run_id)}')" class="p-1 rounded text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition" title="Delete"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button></td></tr>`;

async function deleteHistoryEntry(runId) {
    await api('DELETE', '/api/history/' + runId);
    loadProfileHistory();
    loadHistory();
}

let activeRunTab = 'workflow';

function openRunModal(runId, title, runType) {
    currentRunId = runId;
    activeRunTab = 'workflow';
    document.getElementById('run-modal-title').textContent = title || 'Run Output';
    document.getElementById('run-output').innerHTML = '';
    document.getElementById('run-status-badge').className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-400';
    document.getElementById('run-status-dot').className = 'w-1.5 h-1.5 rounded-full bg-gray-400 animate-pulse';
    document.getElementById('run-status-text').textContent = 'Starting...';
    document.getElementById('run-current-step').textContent = '';
    document.getElementById('run-current-step').classList.add('hidden');
    document.getElementById('run-tabs').classList.add('hidden');
    document.getElementById('run-tab-list').innerHTML = '';
    openModal('run-modal');
    pollRun(runId, runType);
}

async function pollRun(runId, runType) {
    if (runPollTimer) clearInterval(runPollTimer);

    // If called from history with known type, go directly to history (skip active runs)
    let data;
    if (runType) {
        data = { error: true };
    } else {
        data = await api('GET', '/api/runs/' + runId);
    }

    // If not found in active runs, try history
    if (data.error) {
        const histUrl = runType ? `/api/history/${runId}?type=${runType}` : `/api/history/${runId}`;
        const hist = await api('GET', histUrl);
        if (hist.error) {
            document.getElementById('run-output').innerHTML = '<div class="text-gray-500">Run data not found.</div>';
            return;
        }
        // Render from history
        const el = document.getElementById('run-output');
        const steps = hist.steps || {};
        const stepNames = Object.keys(steps);
        const hasSteps = stepNames.length > 0;

        // Show tabs for workflow history
        const tabsEl = document.getElementById('run-tabs');
        const currentStepEl = document.getElementById('run-current-step');
        currentStepEl.classList.add('hidden');
        if (hasSteps) {
            tabsEl.classList.remove('hidden');
            const tabList = document.getElementById('run-tab-list');
            let html = `<button onclick="switchRunTab('workflow')" id="run-tab-workflow" class="px-3 py-2 text-xs font-medium border-b-2 transition ${activeRunTab === 'workflow' ? 'border-violet-500 text-violet-600 dark:text-violet-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}">Workflow</button>`;
            for (const name of stepNames) {
                const st = steps[name].status;
                const dot = st === 'completed' ? 'bg-green-400' : st === 'failed' ? 'bg-red-400' : 'bg-gray-400';
                html += `<button onclick="switchRunTab('${esc(name)}')" id="run-tab-${esc(name)}" class="px-3 py-2 text-xs font-medium border-b-2 transition flex items-center gap-1.5 ${activeRunTab === name ? 'border-violet-500 text-violet-600 dark:text-violet-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${esc(name)}</button>`;
            }
            tabList.innerHTML = html;
        } else {
            tabsEl.classList.add('hidden');
        }

        let lines;
        if (activeRunTab === 'workflow' || !hasSteps) {
            lines = (hist.workflow_log?.length ? hist.workflow_log : null) || hist.output || [];
        } else {
            lines = steps[activeRunTab]?.output || [];
        }
        if (!lines.length && hist.output_preview) {
            lines = hist.output_preview.split('\n');
        }
        if (!lines.length) {
            el.innerHTML = '<div class="text-gray-500">No output available for this run.</div>';
        } else {
            el.innerHTML = lines.map(l => {
                const s = typeof l === 'string' ? l : String(l);
                if (s.startsWith('[FAIL') || s.startsWith('[ABORT') || s.startsWith('ERROR')) return `<div class="text-red-400">${esc(s)}</div>`;
                if (s.startsWith('[DONE') || s.startsWith('[SKIP')) return `<div class="text-green-400">${esc(s)}</div>`;
                if (s.startsWith('[RUN') || s.startsWith('=')) return `<div class="text-sky-400">${esc(s)}</div>`;
                return esc(s);
            }).join('');
        }

        const sc = { completed: 'bg-green-50 dark:bg-green-500/10 text-green-700 dark:text-green-400 border-green-200 dark:border-green-500/20', failed: 'bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-400 border-red-200 dark:border-red-500/20' };
        const dc = { completed: 'bg-green-400', failed: 'bg-red-400' };
        document.getElementById('run-status-badge').className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ${sc[hist.status] || sc.completed}`;
        document.getElementById('run-status-dot').className = `w-1.5 h-1.5 rounded-full ${dc[hist.status] || dc.completed}`;
        document.getElementById('run-status-text').textContent = { completed: 'Completed', failed: 'Failed' }[hist.status] || hist.status;
        return;
    }

    // Active run — poll periodically
    runPollTimer = setInterval(async () => {
        const data = await api('GET', '/api/runs/' + runId);
        const steps = data.steps || {};
        const stepNames = Object.keys(steps);
        const hasSteps = stepNames.length > 0;

        // Show/hide tabs and current step indicator
        const tabsEl = document.getElementById('run-tabs');
        const currentStepEl = document.getElementById('run-current-step');
        if (hasSteps) {
            tabsEl.classList.remove('hidden');
            const tabList = document.getElementById('run-tab-list');
            let html = `<button onclick="switchRunTab('workflow')" id="run-tab-workflow" class="px-3 py-2 text-xs font-medium border-b-2 transition ${activeRunTab === 'workflow' ? 'border-violet-500 text-violet-600 dark:text-violet-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}">Workflow</button>`;
            for (const name of stepNames) {
                const st = steps[name].status;
                const dot = st === 'completed' ? 'bg-green-400' : st === 'failed' ? 'bg-red-400' : st === 'running' ? 'bg-sky-400 animate-pulse' : 'bg-gray-400';
                html += `<button onclick="switchRunTab('${esc(name)}')" id="run-tab-${esc(name)}" class="px-3 py-2 text-xs font-medium border-b-2 transition flex items-center gap-1.5 ${activeRunTab === name ? 'border-violet-500 text-violet-600 dark:text-violet-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${esc(name)}</button>`;
            }
            tabList.innerHTML = html;

            if (data.current_step) {
                currentStepEl.textContent = 'Running: ' + data.current_step;
                currentStepEl.classList.remove('hidden');
            } else {
                currentStepEl.classList.add('hidden');
            }
        } else {
            tabsEl.classList.add('hidden');
            currentStepEl.classList.add('hidden');
        }

        // Render output for active tab
        const el = document.getElementById('run-output');
        let lines;
        if (activeRunTab === 'workflow' || !hasSteps) {
            lines = (data.workflow_log?.length ? data.workflow_log : null) || data.output || [];
        } else {
            lines = steps[activeRunTab]?.output || [];
        }
        el.innerHTML = lines.map(l => {
            if (l.startsWith('[FAIL') || l.startsWith('[ABORT') || l.startsWith('ERROR')) return `<div class="text-red-400">${esc(l)}</div>`;
            if (l.startsWith('[DONE') || l.startsWith('[SKIP')) return `<div class="text-green-400">${esc(l)}</div>`;
            if (l.startsWith('[RUN') || l.startsWith('=')) return `<div class="text-sky-400">${esc(l)}</div>`;
            return esc(l);
        }).join('');
        el.scrollTop = el.scrollHeight;

        const sc = { running: 'bg-sky-50 dark:bg-sky-500/10 text-sky-700 dark:text-sky-400 border-sky-200 dark:border-sky-500/20', completed: 'bg-green-50 dark:bg-green-500/10 text-green-700 dark:text-green-400 border-green-200 dark:border-green-500/20', failed: 'bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-400 border-red-200 dark:border-red-500/20', starting: 'bg-purple-50 dark:bg-purple-500/10 text-purple-700 dark:text-purple-400 border-purple-200 dark:border-purple-500/20' };
        const dc = { running: 'bg-sky-400', completed: 'bg-green-400', failed: 'bg-red-400', starting: 'bg-purple-400' };
        document.getElementById('run-status-badge').className = `inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ${sc[data.status] || sc.starting}`;
        document.getElementById('run-status-dot').className = `w-1.5 h-1.5 rounded-full ${dc[data.status] || dc.starting} ${data.status === 'running' ? 'animate-pulse' : ''}`;
        document.getElementById('run-status-text').textContent = { completed: 'Completed', failed: 'Failed', running: 'Running...' }[data.status] || 'Starting...';
        if (data.status === 'completed' || data.status === 'failed') { clearInterval(runPollTimer); runPollTimer = null; }
    }, 500);
}

function switchRunTab(name) {
    activeRunTab = name;
    // Re-render tabs and output immediately
    if (currentRunId) pollRun(currentRunId);
}

function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

document.querySelectorAll('#profile-modal, #workflow-modal, #run-modal').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.add('hidden'); });
});

init();
</script>
