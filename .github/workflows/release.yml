name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Figure out the next version
        id: version
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="v0.1.0"
          else
            MAJOR=$(echo "$LAST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | cut -d. -f3)
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION"

      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -x -q

      - name: Create release archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="launch-control-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="launch-control-${VERSION}/" -o "${ARCHIVE}" HEAD
          echo "archive=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" "${{ env.archive }}" \
            --title "$VERSION" \
            --generate-notes

      - name: Prune old releases (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName --limit 100 \
            --jq '.[].tagName' | tail -n +4 | while read -r TAG; do
            gh release delete "$TAG" --yes --cleanup-tag
            echo "Deleted old release $TAG"
          done

      - name: Show result in the run summary
        run: echo "Released ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
